name: Refresh Liga Portugal Betclic 2026-27
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 9 * * *' # 06:10 America/Sao_Paulo (UTC-3)
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: liga-portugal-pages
  cancel-in-progress: false
jobs:
  refresh-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing dashboard repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official fixtures/table and independent ESPN results; fail closed
        run: python3 refresh_validate.py
      - name: Build dashboard
        run: python3 build_dashboard.py
      - name: Validate page/data consistency before publication
        run: python3 validate_build.py
      - name: Store refreshed source data and dashboard in the same repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site source_snapshots
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Liga Portugal Betclic 2026/27 data'
            git push origin HEAD:main
          else
            echo 'No source or dashboard changes; current publication remains valid.'
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy stable Pages site
        id: deployment
        uses: actions/deploy-pages@v4
